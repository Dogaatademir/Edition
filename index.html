<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/editionsiyah.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iPhone Safari, 16 px'ten küçük yazılı seçim kutularına dokunulunca sayfayı yakınlaştırır.
      // Yalnızca iOS'ta otomatik yakınlaştırmayı kapatır; iOS iki parmakla yakınlaştırmaya yine izin verir.
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1');
      }
    </script>
    <title>Edition Coffee Roastery</title>
    <meta name="description" content="Edition Coffee Roastery — taze kavrulmuş Türk kahvesi, filtre kahve ve espresso. Yüzyıllık geleneği modern kavurmayla buluşturuyoruz. 850 TL üzeri kargo ücretsiz." />

    <!-- Clarity, Google Ads ve Meta Pixel yalnızca çerez onayından sonra yüklenir: src/lib/consent.ts -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
